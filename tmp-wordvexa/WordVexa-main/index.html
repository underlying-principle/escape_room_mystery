<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070b14" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070b14'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='18' font-weight='bold' fill='%234ee1ff' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E"
    />
    <meta name="description" content="WORDSHIFT — a word-ladder puzzle game. You aren't guessing words. You are manipulating words." />
    <title>WORDSHIFT</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #070b14;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        position: fixed;
        inset: 0;
      }
      /* Pre-React splash so the first paint is never white */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: radial-gradient(120% 100% at 50% 0%, #0d1526 0%, #070b14 60%);
        color: #8fb3d9;
        font-family: system-ui, sans-serif;
        letter-spacing: 0.35em;
        font-size: 14px;
      }
      #boot .bar {
        width: 160px;
        height: 2px;
        background: rgba(78, 225, 255, 0.15);
        border-radius: 2px;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        background: #4ee1ff;
        border-radius: 2px;
        animation: bootsweep 1.1s ease-in-out infinite;
      }
      @keyframes bootsweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(420%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">WORDSHIFT<div class="bar"><i></i></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
